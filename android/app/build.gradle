plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.yapeapplication'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.yapeapplication'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
